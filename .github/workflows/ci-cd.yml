name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t urlshortener .

      - name: Tag Docker image
        run: |
          docker tag urlshortener:latest \
            816352410007.dkr.ecr.eu-north-1.amazonaws.com/urlshortener:latest

      - name: Push Docker image
        run: |
          docker push \
            816352410007.dkr.ecr.eu-north-1.amazonaws.com/urlshortener:latest

      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/urlshortener-key.pem"
          chmod 600 "$HOME/.ssh/urlshortener-key.pem"

          ssh-keyscan -H 13.51.233.43 >> "$HOME/.ssh/known_hosts"
          ssh-keyscan -H 13.60.183.169 >> "$HOME/.ssh/known_hosts"

      - name: Deploy to EC2 #1
        run: |
          ssh -i "$HOME/.ssh/urlshortener-key.pem" ubuntu@13.51.233.43 << 'EOF'
            set -e

            echo "Logging into ECR..."
            aws ecr get-login-password --region eu-north-1 | \
              docker login --username AWS --password-stdin \
              816352410007.dkr.ecr.eu-north-1.amazonaws.com

            echo "Pulling latest image..."
            docker pull \
              816352410007.dkr.ecr.eu-north-1.amazonaws.com/urlshortener:latest

            echo "Stopping old container..."
            docker stop urlshortener 2>/dev/null || true
            docker rm urlshortener 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name urlshortener \
              --restart unless-stopped \
              -p 80:8000 \
              816352410007.dkr.ecr.eu-north-1.amazonaws.com/urlshortener:latest

            echo "Deployment complete."
          EOF