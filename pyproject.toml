[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urlshortner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]


[tool.hatch.build.targets.wheel]
packages = ["app"]
