name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t urlshortener .

      - name: Tag Docker image
        run: |
          docker tag urlshortener:latest \
            ${{ steps.login-ecr.outputs.registry }}/urlshortener:latest

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/urlshortener:latest

      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" \
            > "$HOME/.ssh/urlshortener-key.pem"
          chmod 600 "$HOME/.ssh/urlshortener-key.pem"

          ssh-keyscan -H ${{ vars.EC2_1_IP }} >> "$HOME/.ssh/known_hosts"
          ssh-keyscan -H ${{ vars.EC2_2_IP }} >> "$HOME/.ssh/known_hosts"

      - name: Deploy to EC2 #1
        run: |
          ssh -i "$HOME/.ssh/urlshortener-key.pem" ubuntu@${{ vars.EC2_1_IP }} << 'EOF'
            set -e

            echo "Logging into ECR..."
            aws ecr get-login-password --region eu-north-1 | \
              docker login --username AWS --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            echo "Pulling latest image..."
            docker pull \
              ${{ steps.login-ecr.outputs.registry }}/urlshortener:latest

            echo "Updating environment..."
            printf '%s\n' \
              'DATABASE_URL=${{ secrets.DATABASE_URL }}' \
              'LOG_FILE=/app/data/app.log' \
              'BASE_URL=http://${{ vars.ALB_DNS }}' \
              'SHORT_CODE_ALPHABET=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' \
              > ~/urlshortener.env

            echo "Replacing container..."
            docker stop urlshortener 2>/dev/null || true
            docker rm urlshortener 2>/dev/null || true

            docker run -d \
              --name urlshortener \
              --restart unless-stopped \
              --env-file ~/urlshortener.env \
              -p 80:8000 \
              ${{ steps.login-ecr.outputs.registry }}/urlshortener:latest

            echo "Checking application..."
            sleep 5
            curl -f http://localhost/live

            echo "EC2 #1 deployment successful."
          EOF

      - name: Deploy to EC2 #2
        run: |
          ssh -i "$HOME/.ssh/urlshortener-key.pem" ubuntu@${{ vars.EC2_2_IP }} << 'EOF'
            set -e

            echo "Logging into ECR..."
            aws ecr get-login-password --region eu-north-1 | \
              docker login --username AWS --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            echo "Pulling latest image..."
            docker pull \
              ${{ steps.login-ecr.outputs.registry }}/urlshortener:latest

            echo "Updating environment..."
            printf '%s\n' \
              'DATABASE_URL=${{ secrets.DATABASE_URL }}' \
              'LOG_FILE=/app/data/app.log' \
              'BASE_URL=http://${{ vars.ALB_DNS }}' \
              'SHORT_CODE_ALPHABET=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' \
              > ~/urlshortener.env

            echo "Replacing container..."
            docker stop urlshortener 2>/dev/null || true
            docker rm urlshortener 2>/dev/null || true

            docker run -d \
              --name urlshortener \
              --restart unless-stopped \
              --env-file ~/urlshortener.env \
              -p 80:8000 \
              ${{ steps.login-ecr.outputs.registry }}/urlshortener:latest

            echo "Checking application..."
            sleep 5
            curl -f http://localhost/live

            echo "EC2 #2 deployment successful."
          EOF